# Catppuccin plugin setup. Sourced by tmux.conf at startup, and again by the
# client-light-theme / client-dark-theme hooks after they set @catppuccin_flavor.

# The plugin sets its palette, and the module colours derived from it, with
# `set -o` (only if unset), so clear the previous flavour's values first.
# @catppuccin_reset only covers the palette and runs inside the plugin, where
# it would also wipe the softened Latte below and our window options.
run 'tmux show -g | grep -Eo "^@(thm_[a-z0-9_]+|catppuccin_(status_[a-z_]+|[a-z_]+_color)) " | xargs -r -n1 tmux set -Ugq'

%if "#{==:#{@catppuccin_flavor},latte}"
# source-file ~/.config/tmux/latte-soft.conf  # off: trying stock Latte
%endif

# Plain window list: the plugin leaves it unstyled and we write it below.
# The status items on the right keep the plugin's pills.
set -g @catppuccin_window_status_style "none"

# Custom branch module: left cap -> icon on red -> middle sep -> branch text on surface_0
set -g  @catppuccin_status_custom_branch ""
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_red},bg=#{E:@thm_surface_0}]#{E:@catppuccin_status_left_separator}"
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_crust},bg=#{E:@thm_red}]\ue729 "
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_red},bg=#{E:@thm_surface_0}]#{E:@catppuccin_status_middle_separator}"
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] #(git -C #{pane_current_path} symbolic-ref-or-commit) "

run "$HOME/.config/tmux/plugins/catppuccin/catppuccin.tmux"

set -g status-style "bg=default"
set -g status-right-length 150
set -g status-left-length 100

set -g status-left ""

# Window list as plain coloured text; #{@thm_*} is read at draw time, so it
# follows the flavour
setw -g window-status-separator ""
setw -g window-status-format " #[fg=#{@thm_overlay_1}]#I #[fg=#{@thm_subtext_0}]#W "
setw -g window-status-current-format " #[fg=#{@thm_mauve},bold]#I #[fg=#{@thm_fg},nobold]#W "

set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_custom_branch}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
