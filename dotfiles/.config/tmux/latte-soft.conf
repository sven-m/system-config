# Catppuccin Latte with accents at 80% of their OKLCH chroma.
# The plugin sets @thm_* with `set -o`, so values set here before it runs win.
set -g @catppuccin_flavor "latte"
set -g @thm_rosewater "#d08f80"
set -g @thm_flamingo "#d07f7e"
set -g @thm_pink "#db7fc1"
set -g @thm_mauve "#804bd4"
set -g @thm_red "#bf3644"
set -g @thm_maroon "#d3575c"
set -g @thm_peach "#ea723e"
set -g @thm_yellow "#d29247"
set -g @thm_green "#549c45"
set -g @thm_teal "#3e8f94"
set -g @thm_sky "#44a4d6"
set -g @thm_sapphire "#479cad"
set -g @thm_blue "#326ad9"
set -g @thm_lavender "#778ae7"
