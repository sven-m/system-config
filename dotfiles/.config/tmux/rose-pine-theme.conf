# Rosé Pine theme for rose-pine.conf. Sourced at startup and by the light/dark
# hooks after they set @rose_pine_variant.

# Pane default colours (base/text), so panes read as Rosé Pine whatever
# Ghostty's theme
%if "#{==:#{@rose_pine_variant},dawn}"
set -g window-style "bg=#faf4ed,fg=#575279"
%else
set -g window-style "bg=#191724,fg=#e0def4"
%endif

set -g @rose_pine_directory "on"
run "$HOME/.config/tmux/plugins/rose-pine/rose-pine.tmux"

# The plugin puts the session and current program on the left; move them to
# the right, after the directory. -F copies the options' current text.
set -gF status-right "#{status-right}#{status-left}"
set -g status-left ""
