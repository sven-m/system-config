# Rosé Pine (main, dark): a small standalone tmux config, no plugins.
# Runs on its own server, next to the Catppuccin one: `tmux-rose` (see .bashrc)

set -g default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Palette: https://rosepinetheme.com/palette
#   base #191724  overlay #26233a  muted #6e6a86  subtle #908caa  text #e0def4
#   love #eb6f92  gold #f6c177  rose #ebbcba  foam #9ccfd8  iris #c4a7e7
#   highlight-med #403d52

# Pane default colours, so panes read as Rosé Pine whatever Ghostty's theme
set -g window-style "bg=#191724,fg=#e0def4"

set -g status-style "bg=#191724,fg=#908caa"
set -g status-left ""
set -g status-right "#[fg=#eb6f92]#{?client_prefix,● ,}#[fg=#c4a7e7]#S #[fg=#6e6a86]· #[fg=#9ccfd8]#{b:pane_current_path} "
set -g status-right-length 80

setw -g window-status-separator ""
setw -g window-status-format " #[fg=#6e6a86]#I #[fg=#908caa]#W "
setw -g window-status-current-format " #[fg=#ebbcba,bold]#I #[fg=#e0def4,nobold]#W "
setw -g window-status-activity-style "fg=#f6c177"

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#ebbcba"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g message-command-style "bg=#26233a,fg=#e0def4"
setw -g mode-style "bg=#403d52,fg=#e0def4"
set -g display-panes-active-colour "#ebbcba"
set -g display-panes-colour "#6e6a86"
setw -g clock-mode-colour "#ebbcba"
