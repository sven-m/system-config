# Rosé Pine (main, dark): a small standalone tmux config.
# Runs on its own server, next to the Catppuccin one: `tmux-rose` (see .bashrc)

set -g default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane default colours (Rosé Pine base/text), so panes read as Rosé Pine
# whatever Ghostty's theme
set -g window-style "bg=#191724,fg=#e0def4"

set -g @rose_pine_variant "main"
set -g @rose_pine_directory "on"
run "$HOME/.config/tmux/plugins/rose-pine/rose-pine.tmux"

# The plugin puts the session and current program on the left; move them to
# the right, after the directory. -F copies the options' current text.
set -gF status-right "#{status-right}#{status-left}"
set -g status-left ""
