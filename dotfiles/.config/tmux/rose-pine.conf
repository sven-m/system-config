# Rosé Pine: a small standalone tmux config. Main when the terminal is dark,
# Dawn when it's light. Runs on its own server, next to the Catppuccin one:
# `tmux-rose` (see .bashrc)

set -g default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Main until the terminal reports its theme; tmux 3.6+ fires these hooks when
# the terminal (Ghostty) reports a light/dark change
set -g @rose_pine_variant "main"
source-file ~/.config/tmux/rose-pine-theme.conf
set-hook -g client-light-theme {
  set -g @rose_pine_variant "dawn"
  source-file ~/.config/tmux/rose-pine-theme.conf
}
set-hook -g client-dark-theme {
  set -g @rose_pine_variant "main"
  source-file ~/.config/tmux/rose-pine-theme.conf
}
