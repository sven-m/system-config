set-option -s command-alias[100] 'create-session=new-session session-dir-picker'
set-option -s command-alias[101] 'apply-config=new-window -n "apply-config" conf wait apply'
set-option -s command-alias[102] 'rebase-session=attach-session -c "#{pane_current_path}"'
set-option -s command-alias[103] 'save-sessions=run-shell "mkdir -p ~/.local/state/tmux; tmux list-sessions -F \"#{@restore-sessions-template}\" > ~/.local/state/tmux/restore-sessions.tmux"'
set-option -s command-alias[104] 'restore-sessions=source-file "~/.local/state/tmux/restore-sessions.tmux"'

# Template for save-sessions: writes a .tmux script that recreates every
# session, with no shell script involved -- list-sessions emits one block per
# session, and restore-sessions sources the result back.
#
# Two expansion passes are in play, so there are two levels of escaping:
#   #{...}   expanded NOW, at save time (session/window/pane values)
#   ##{...}  becomes a literal #{...} in the generated file, to be evaluated
#            at restore time -- that's how the %if existence check works
#   \ at end of line continues the template without emitting a newline, which
#            is what lets the W:/P: loops be written nested rather than as one
#            long line. The next line's leading spaces DO reach the output, so
#            argument continuations start at column 0 and the two-space indent
#            is deliberate -- it's what indents each window block in the
#            generated file.
#
# It has to be list-sessions -F; display-message -p also runs the format
# through strftime, which silently eats the directives (%endif -> "14ndif"
# on the 14th, since %e is day-of-month). list-sessions -F does not.
#
# The %if condition asks "is this session already live?" by matching
# s(<name>) against s() of every current session, so re-sourcing leaves
# existing sessions untouched. The s(...) wrapper bounds each name, so a
# session called alph does not match inside s(alpha).
set -s @restore-sessions-template "%if '##{?##{m:*s(#{session_name})*,##{S:s(##{session_name})}},0,1}'

new-session -d -s '#{session_name}' -c '#{session_path}'

#{W:\
#{P/i:\
  #{?#{==:#{pane_index},#{pane-base-index}},new-window -k#{?automatic-rename,, -n '#{window_name}'},split-window} \
-t '#{session_name}:#{window_index}' \
-c '#{pane_current_path}' \
#{pane_start_command}
}\
  select-layout -t '#{session_name}:#{window_index}' '#{window_layout}'

}select-window -t '#{session_name}:#{window_index}'

%endif
"

bind % split-window -h -c '#{pane_current_path}'  # Split panes horizontal
bind -n M-\\ split-window -h -c '#{pane_current_path}'  # Split panes horizontal

bind \" split-window -c '#{pane_current_path}'  # Split panes vertically
bind -n M-Enter split-window -c '#{pane_current_path}'  # Split panes vertically

# Reload config in the current session
bind r command-prompt -I 'source-file ~/.config/tmux/tmux.conf'
bind s choose-session -F "#[fg=#f9e2af]#(cd #{session_path}; dirs +0)" -O name
bind R respawn-window -k
bind P respawn-pane -k

# Save/restore all sessions. Lowercase, not C-S/C-R: a terminal masks the
# letter with 0x1f to make a control byte, which folds Shift away -- C-s and
# C-S both arrive as 0x13, so an uppercase binding would never match.
bind C-s save-sessions
bind C-r restore-sessions

bind N new-window -n notes -S nvim -c VimwikiIndex

bind x run-shell "cd #{pane_current_path} && xed ."

bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-option -g detach-on-destroy off
set -g mouse on
set -g mode-keys vi

set-window-option -g automatic-rename on
set-option -g set-titles on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom

set -g cursor-style bar
set-option -g default-terminal 'tmux-256color'

set -g status-interval 1
set -g display-time 3000

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Custom branch module: left cap -> icon on red -> middle sep -> branch text on surface_0
set -g  @catppuccin_status_custom_branch ""
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_red},bg=#{E:@thm_surface_0}]#{E:@catppuccin_status_left_separator}"
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_crust},bg=#{E:@thm_red}]\ue729 "
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_red},bg=#{E:@thm_surface_0}]#{E:@catppuccin_status_middle_separator}"
set -ag @catppuccin_status_custom_branch "#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] #(git -C #{pane_current_path} symbolic-ref-or-commit) "

run "$HOME/.config/tmux/plugins/catppuccin/catppuccin.tmux"

set -g status-style "bg=default"
set -g status-right-length 150
set -g status-left-length 100

set -g status-left ""

set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_custom_branch}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
