# Tokyo Night: a small standalone tmux config for trying the theme. Uses the
# tmux themes that ship with the tokyonight nvim plugin: Night when dark, Day
# when light. Runs on its own server, next to the Catppuccin one:
# `tmux-tokyonight` (see .bashrc)

set -g default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Night until the terminal reports its theme; tmux 3.6+ fires these hooks when
# the terminal (Ghostty) reports a light/dark change. The theme files only
# `set -g`, so sourcing the other one replaces everything.
source-file ~/.config/tmux/plugins/tokyonight/tokyonight_night.tmux
set-hook -g client-light-theme "source-file ~/.config/tmux/plugins/tokyonight/tokyonight_day.tmux"
set-hook -g client-dark-theme "source-file ~/.config/tmux/plugins/tokyonight/tokyonight_night.tmux"
