# zenbones: a small standalone tmux config for trying the theme. Uses the tmux
# themes that ship with the zenbones nvim plugin. Runs on its own server, next
# to the Catppuccin one: `tmux-zenbones` (see .bashrc)

set -g default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Dark until the terminal reports its theme; tmux 3.6+ fires these hooks when
# the terminal (Ghostty) reports a light/dark change. The theme files only
# `set -g`, so sourcing the other one replaces everything.
source-file ~/.config/tmux/plugins/zenbones/zenbones_dark.tmux
set-hook -g client-light-theme "source-file ~/.config/tmux/plugins/zenbones/zenbones_light.tmux"
set-hook -g client-dark-theme "source-file ~/.config/tmux/plugins/zenbones/zenbones_dark.tmux"
